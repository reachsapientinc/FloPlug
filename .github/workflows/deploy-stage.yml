name: Deploy to Stage

# on:
#   push:
#     branches:
#       - stage

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm install

      - name: Build shared
        run: npm --prefix packages/shared run build

      - name: Sync shared into functions
        run: |
          rm -rf functions/shared
          mkdir -p functions/shared/dist
          cp -r packages/shared/dist/* functions/shared/dist/
          cp packages/shared/package.json functions/shared/package.json

      - name: Build functions
        run: npm --prefix functions run build

      - name: Build frontend
        run: npm --prefix frontend run build -- --mode development
        env:
          VITE_FIREBASE_API_KEY:            ${{ secrets.STAGE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.STAGE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.STAGE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.STAGE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.STAGE_FIREBASE_APP_ID }}

      - name: Write functions .env
        run: echo "WEB_API_KEY=${{ secrets.STAGE_WEB_API_KEY }}" > functions/.env

      # 🌟 CHANGED: Step to check for file modifications inside the functions src path
      - name: Get Changed Functions Files
        id: changed-functions
        uses: tj-actions/changed-files@v44
        with:
          files: functions/src/**
          separator: ","

      # 🌟 CHANGED: Step to parse file updates into explicit Firebase targeting parameters (e.g. functions:getUser)
      - name: Set Firebase Deploy Target String
        id: parse-targets
        run: |
          CHANGED_FILES="${{ steps.changed-functions.outputs.all_changed_files }}"
          if [ -z "$CHANGED_FILES" ]; then
            echo "FUNCTION_TARGETS=" >> $GITHUB_ENV
            echo "No function modifications discovered."
          else
            TARGETS=""
            IFS=',' read -ra ADDR <<< "$CHANGED_FILES"
            for file in "${ADDR[@]}"; do
              FILENAME=$(basename -- "$file")
              FUNC_NAME="${FILENAME%.*}"
              
              if [ -z "$TARGETS" ]; then
                TARGETS="functions:$FUNC_NAME"
              else
                TARGETS="$TARGETS,functions:$FUNC_NAME"
              fi
            done
            echo "FUNCTION_TARGETS=$TARGETS" >> $GITHUB_ENV
            echo "Targeting specific updates: $TARGETS"
          fi

      # This step handles your Frontend static delivery as before

      - name: Deploy to Firebase Stage
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.MY_GH_TOKEN }}
          firebaseServiceAccount: ${{ secrets.STAGE_FIREBASE_SERVICE_ACCOUNT }}
          projectId: floplug-stage
          channelId: live
        
      # 🌟 CHANGED: Conditional deployment step targeting only modified Cloud Functions
      - name: Deploy Modified Cloud Functions Only
        if: env.FUNCTION_TARGETS != ''
        run: npx firebase-tools deploy --only ${{ env.FUNCTION_TARGETS }} --project floplug-stage
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}